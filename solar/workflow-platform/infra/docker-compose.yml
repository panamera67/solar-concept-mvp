version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: workflows
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.next
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/workflows
      PORT: 3000
    ports:
      - "3000:3000"
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/workflows
      WORKER_POLL_INTERVAL_MS: 3000
      WORKER_MAX_RETRIES: 3
    restart: unless-stopped

volumes:
  pgdata:
