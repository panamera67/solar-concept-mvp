version: "3.9"

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../../.env.prod
    command: ["npm", "run", "start:prod"]
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - internal

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    env_file:
      - ../../.env.prod
    restart: unless-stopped
    networks:
      - internal
      - web

  db:
    image: postgres:15
    env_file:
      - ../../.env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - web
      - internal

networks:
  web:
  internal:

volumes:
  postgres_data:
